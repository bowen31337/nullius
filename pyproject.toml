# Root of the nullius uv workspace
# (app_spec.xml, "Workspace Foundation & Repository Skeleton", feature 1;
# docs/nullius-tech-architecture.md §18-§19 for the stack and layout).
#
# THE WORKSPACE CONTRACT — read before adding a package.
#
# Every workspace member lives in exactly one place: its own directory
# directly under packages/, with its own pyproject.toml. The members glob
# below declares it automatically — verified: a packages/<name>/ directory
# containing a pyproject.toml joins the workspace (and uv.lock) with no
# edit to this file, and a directory without one is ignored. So:
#
#   * DO NOT edit this file to register a member. `packages/*` already
#     declares it; the root stays outside every feature's file claim.
#   * DO NOT nest members (packages/data/ingest/ is not a member — a
#     member is exactly one directory deep; spell it data-ingest or
#     similar). One depth, one layout, declared once, here.
#   * DO NOT create a competing project root, a second src/ tree, or a
#     top-level package outside packages/. The module loader
#     (src/app/module_loader.py) discovers components by scanning the
#     members this file declares, so anything outside packages/ is
#     invisible to composition by construction.
#
# This root project itself exists so the shared application factory
# (src/app/, imported as `app.module_loader`) is installable for every
# suite under tests/ — the root owns no runtime dependencies of its own;
# members own theirs, and uv resolves them together into uv.lock.
#
# Test configuration deliberately lives in pytest.ini, which stays
# authoritative over any [tool.pytest.ini_options] section.

[project]
name = "nullius"
version = "0.1.0"
description = "Recursively self-improving crypto research system with a measured false discovery rate."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The root ships only the factory package: `import app.module_loader`.
packages = ["src/app"]

[tool.uv.workspace]
# The single source of truth for project layout. Members are exactly the
# directories matched here; see the contract above.
members = ["packages/*"]

[dependency-groups]
# Shared tooling for the repository-level tests/ tree (pytest.ini sets
# minversion 8.0). uv installs the default `dev` group on `uv run`/`uv sync`.
dev = ["pytest>=8.0"]
