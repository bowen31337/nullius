[pytest]
# Shared pytest configuration for the nullius workspace
# (app_spec.xml, "Workspace Foundation & Repository Skeleton", feature 3).
#
# Every suite in the workspace — contract, invariants, e2e — lives under the
# repository-level tests/ tree, so the fixtures in tests/conftest.py apply to
# all of them: each test gets a temporary lake root and a DATABASE_URL that
# points at a test-only database (TEST_DATABASE_URL when the environment
# provides one, else a throwaway SQLite file). pytest.ini is authoritative
# over any [tool.pytest.ini_options] that may later appear in pyproject.toml.

minversion = 8.0
testpaths = tests
addopts =
    -ra
    --strict-config
    --strict-markers
