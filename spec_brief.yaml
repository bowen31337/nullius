competency_questions:
- id: cq-1
  question: Can the system discover predictive signals in crypto markets using only free CEX
    data?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §2.1
    confidence: 0.9
    span: Discover predictive signals with positive, cost-adjusted, out-of-sample information
      ratio, using only free public CEX data (REST + websocket).
    needs_review: false
- id: cq-2
  question: Can the system maintain a measured false discovery rate for the research process
    itself?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §2.1
    confidence: 0.9
    span: Maintain a *measured* false discovery rate for the research process itself, not
      merely a backtest metric for its output.
    needs_review: false
- id: cq-3
  question: Can the system close a recursive loop at the exploration layer so that search
    quality improves with accumulated campaign history?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §2.1
    confidence: 0.9
    span: Close a recursive loop at the exploration layer so that search quality improves
      with accumulated campaign history.
    needs_review: false
- id: cq-4
  question: Can the system produce an automatic, honest count of hypotheses tested?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §2.1
    confidence: 0.9
    span: Produce an honest, automatic count of hypotheses tested, so multiple-testing deflation
      can be applied correctly rather than guessed.
    needs_review: false
- id: cq-5
  question: Can the system prove its core thesis wrong at milestone M3 before any capital
    is at risk?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §2.1
    confidence: 0.9
    span: Fail fast and cheaply. The system must be able to prove its own core thesis wrong
      at milestone M3 before any capital is at risk.
    needs_review: false
- id: cq-6
  question: Can a signal function access future data?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §3
    confidence: 0.9
    span: No access to future data. The `MarketWindow` object physically cannot return data
      after `ctx.t`.
    needs_review: false
- id: cq-7
  question: Can planted null nodes be detected by the signal agent?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §4.1
    confidence: 0.9
    span: The agent cannot detect this. There is no synthetic price series to sniff. The features,
      prices, order books and volumes are all real. Only the scorer knows.
    needs_review: false
- id: cq-8
  question: Can the exploration policy learn the value of a node from its `is_null` status?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §4.2
    confidence: 0.3
    span: '`is_null` is visible to **exactly one component**: the replay scorer. It must never
      appear in: the discovery agent''s prompt or context, the exploration policy''s `observed()`
      prefix, any stored artifact the policy can read during replay, any log the policy-development
      agent reads between revisions.'
    needs_review: true
- id: cq-9
  question: Can the replay engine invoke the evaluator?
  priority: 1
  _provenance:
    by: extracted
    source: architecture.md §1
    confidence: 0.3
    span: Replay must never invoke the evaluator. The replay engine has read access to the
      artifact store and zero access to the evaluator or sandbox. This is what makes dreaming
      free.
    needs_review: true
- id: cq-10
  question: Can the signal sandbox access future data from the data lake?
  priority: 1
  _provenance:
    by: extracted
    source: architecture.md §1
    confidence: 0.3
    span: Future data must be physically absent, not merely forbidden. The signal sandbox
      never mounts the data lake. It receives a pre-sliced, materialized array containing
      only data at or before `t`. Look-ahead becomes impossible rather than discouraged.
    needs_review: true
- id: cq-11
  question: Can an LLM agent modify the evaluator, cost model, or data snapshots?
  priority: 1
  _provenance:
    by: extracted
    source: architecture.md §2
    confidence: 0.9
    span: The evaluator, cost model, and data snapshots live in a read-only trust zone that
      LLM-authored code has no write credential for, and no network path to.
    needs_review: false
- id: cq-12
  question: Can the system detect whether planted nulls are being detected by the signal agent?
  priority: 2
  _provenance:
    by: extracted
    source: prd.md §4.3
    confidence: 0.9
    span: Each campaign, run a two-sample Kolmogorov–Smirnov test on the in-sample score distributions
      of null nodes vs. real nodes. If `p < 0.05`, the nulls are detectable, the agent may
      be learning to identify them, and the campaign's calibration is **void**.
    needs_review: false
- id: cq-13
  question: Can the system compute a signal's marginal contribution to the existing book?
  priority: 2
  _provenance:
    by: extracted
    source: prd.md §6.2
    confidence: 0.3
    span: A new signal correlated 0.9 with the existing book is nearly worthless regardless
      of standalone IR. This is why the artifact stores the **full signal return series**,
      not just a scalar. Marginal contribution against any book is then computable at replay
      time from stored data.
    needs_review: true
- id: cq-14
  question: Can the evaluator be modified after the discovery loop begins?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §6.3
    confidence: 0.3
    span: The self-improvement loop must not be able to modify the evaluator. Enforce with
      a read-only mount and a CI check on the hash.
    needs_review: true
- id: cq-15
  question: Can a replay of a fixed policy on a fixed tree produce different scores?
  priority: 1
  _provenance:
    by: extracted
    source: architecture.md §1
    confidence: 0.3
    span: Replay must be bit-reproducible or the method is invalid. Pinned images, pinned
      seeds, single-threaded BLAS in eval workers, no wall-clock reads in searched code, plus
      a nightly canary that asserts a fixed policy replays a fixed tree to an identical score.
    needs_review: true
- id: cq-16
  question: Can a policy see unrevealed nodes during replay?
  priority: 1
  _provenance:
    by: extracted
    source: architecture.md §10.2
    confidence: 0.9
    span: '`prefix_view()` constructs a fresh object exposing only revealed nodes. It is not
      a filtered view over the full tree; unrevealed nodes are not present in the returned
      structure at all. A policy cannot reach them by introspection, attribute walking, or
      a stray `__dict__` access.'
    needs_review: false
- id: cq-17
  question: Can a null node's evaluation debit statistical degrees of freedom?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §4.1.1
    confidence: 0.9
    span: '**Null nodes cost compute, not statistical power.** A null node''s signal was never
      compared to real forward returns, so it consumes agent calls and CPU but **not degrees
      of freedom**. It must not count toward `K` in the deflation term, and must not debit
      epoch usage in the trial ledger.'
    needs_review: false
- id: cq-18
  question: Can the system track forward-test outcomes for recalibration?
  priority: 2
  _provenance:
    by: extracted
    source: prd.md §5
    confidence: 0.3
    span: Every promoted signal is timestamped and its live forward IC tracked from the promotion
      date forward. After 90 days, that signal has a track record on data that **did not exist
      when the hypothesis was formed**. No purging scheme is needed; the data is honestly
      out of sample by construction. Those outcomes become labels.
    needs_review: true
- id: cq-19
  question: Can the interface accidentally reveal which nodes are null during a live campaign?
  priority: 1
  _provenance:
    by: extracted
    source: design.md §7
    confidence: 0.9
    span: The information barrier is an interface constraint, not only a backend one. `is_null`
      must not be visually inferable by anyone operating a live campaign, including by accident.
    needs_review: false
- id: cq-20
  question: Can the system run without sequestered test data?
  priority: 1
  _provenance:
    by: extracted
    source: prd.md §7.1
    confidence: 0.9
    span: the policy sees only in-sample metrics and diagnostics. On termination it must emit
      `v̂`, the signal it would deploy. It is scored on a **sequestered epoch it has never
      observed in any world**.
    needs_review: false
