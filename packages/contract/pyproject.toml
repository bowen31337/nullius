# The `contract` workspace member — Z0: MarketWindow, signal ABI.
# Immutable, versioned (docs/nullius-tech-architecture.md §5.1, §19).
#
# The root pyproject.toml declares `members = ["packages/*"]`, so this
# directory joins the workspace and uv.lock the moment this file exists —
# no edit to the root is required or wanted (see the workspace contract
# spelled out at the top of the root pyproject.toml).
#
# Layout note, and it is load-bearing: the importable package lives at
# src/contract/, NOT src/nullius/contract/. The module loader
# (src/app/module_loader.py) treats the member's `src` directory as a
# *package-parent* root, and every immediate child of a scan root must
# itself be a package. An `src/nullius/` level has no __init__.py, so the
# scan would stop one directory too high and find nothing.

# Dependencies: pyarrow and polars, and deliberately only those two. Arrow IPC
# is the format a materialized window travels in (feature 14; §5.2's
# `payload=window.to_arrow()`), so this member owns the Arrow dependency rather
# than inheriting it from whichever member happens to write Parquet. Polars is
# the signal return type (feature 11: the entrypoint returns a ``pl.Series``),
# so the member that declares the signal ABI owns the polars dependency too,
# rather than inheriting it from the evaluator that consumes the series.
#
# Both imports are deferred to first use (`contract._arrow.require_arrow`,
# `contract.signal.validate_signal_return`), so the factory's workspace scan —
# which imports this package to fire its @register — requires neither to be
# installed. That keeps the member import-safe in the environments the
# workspace contract promises one will be (factory scan, test sandbox, replay
# path); only the paths that genuinely need Arrow or polars raise, and they
# name the missing dependency when they do.

[project]
name = "nullius-contract"
version = "0.1.0"
description = "Z0 MarketWindow contract and signal ABI for the nullius research system"
requires-python = ">=3.12"
dependencies = [
    # 14.0 shipped the Arrow IPC stream reader this module uses
    # (`pyarrow.ipc.open_stream`) across every supported Python; `>=` rather
    # than `==` because nothing here depends on an Arrow version's behaviour,
    # only on the format.
    "pyarrow>=14.0",
    # A signal returns a polars.Series (feature 11), so the contract that
    # declares the ABI owns the polars dependency. `>=` for the same reason as
    # pyarrow: the validator inspects a series' dtype and finiteness, neither
    # of which depends on a polars version's behaviour.
    "polars>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract"]
